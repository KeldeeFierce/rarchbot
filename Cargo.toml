[package]
name = "rarchbot"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.11"
html2text = "0.17.1"
log = "0.4.33"
reqwest = "0.13.4"
rss = "2.1.0"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
teloxide = { version = "0.17.0", features = ["macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
